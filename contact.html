<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | Sweet Bakery</title>
  <meta name="description" content="Get in touch with Sweet Bakery for general messages and inquiries." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <nav>
      <a href="index.html">Home</a> | 
      <a href="enquiry.html">Enquiry</a> | 
      <a href="contact.html">Contact</a> |
      <a href="about.html">About</a> |
      <a href="products.html">Products</a> |
    </nav>
  </header>

  <main>
    <form id="contactForm" action="submit_contact.php" method="POST" novalidate>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required minlength="3" maxlength="50" />

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required />

      <label for="messageType">Type of Message:</label>
      <select id="messageType" name="messageType" required>
        <option value="">--Please choose an option--</option>
        <option value="general">General Inquiry</option>
        <option value="feedback">Feedback</option>
        <option value="complaint">Complaint</option>
      </select>

      <label for="message">Message:</label>
      <textarea id="message" name="message" required minlength="10" maxlength="500"></textarea>

      <button type="submit">Send Message</button>
      <p id="formError" style="color:red;"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Sweet Bakery. All rights reserved.</p>
  </footer>

  <script>
    const form = document.getElementById('contactForm');
    const errorEl = document.getElementById('formError');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorEl.textContent = '';

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const messageType = form.messageType.value;
      const message = form.message.value.trim();

      if (name.length < 3 || name.length > 50) {
        errorEl.textContent = 'Name must be between 3 and 50 characters.';
        return;
      }
      const emailRegex = /\S+@\S+\.\S+/;
      if (!emailRegex.test(email)) {
        errorEl.textContent = 'Please enter a valid email.';
        return;
      }
      if (!messageType) {
        errorEl.textContent = 'Please select a message type.';
        return;
      }
      if (message.length < 10 || message.length > 500) {
        errorEl.textContent = 'Message must be between 10 and 500 characters.';
        return;
      }

      
      const formData = new FormData(form);

      fetch(form.action, {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (response.ok) return response.text();
        throw new Error('Network response was not ok.');
      })
      .then(data => {
        alert('Thank you for contacting us! We will reply soon.');
        form.reset();
      })
      .catch(error => {
        errorEl.textContent = 'There was a problem sending your message. Please try again later.';
      });
    });
  </script>
</body>
</html>
