<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enquire | Sweet Bakery</title>
  <meta name="description" content="Send us your enquiries about products, volunteering, or sponsorship at Sweet Bakery." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Enquiry Form</h1>
    <nav>
      <a href="index.html">Home</a> | 
      <a href="enquiry.html">Enquiry</a> | 
      <a href="contact.html">Contact</a> |
      <a href="about.html">About</a>|
      <a href="products.html">Products</a>|
    </nav>
  </header>

  <main>
    <form id="enquiryForm" action="submit_enquiry.php" method="POST" novalidate>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required minlength="3" maxlength="50" />

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required />

      <label for="enquiryType">Type of Enquiry:</label>
      <select id="enquiryType" name="enquiryType" required>
        <option value="">--Please choose an option--</option>
        <option value="product">Product</option>
        <option value="volunteer">Volunteer</option>
        <option value="sponsor">Sponsor</option>
      </select>

      <label for="message">Additional Details:</label>
      <textarea id="message" name="message" maxlength="300"></textarea>

      <button type="submit">Submit Enquiry</button>
      <p id="formError" style="color:red;"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Sweet Bakery. All rights reserved.</p>
  </footer>

  <script>
    const form = document.getElementById('enquiryForm');
    const errorEl = document.getElementById('formError');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorEl.textContent = '';

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const enquiryType = form.enquiryType.value;

      if (name.length < 3 || name.length > 50) {
        errorEl.textContent = 'Name must be between 3 and 50 characters.';
        return;
      }
      const emailRegex = /\S+@\S+\.\S+/;
      if (!emailRegex.test(email)) {
        errorEl.textContent = 'Please enter a valid email.';
        return;
      }
      if (!enquiryType) {
        errorEl.textContent = 'Please select an enquiry type.';
        return;
      }

      // Prepare data for submission
      const formData = new FormData(form);

      fetch(form.action, {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (response.ok) return response.text();
        throw new Error('Network response was not ok.');
      })
      .then(data => {
        alert('Thank you for your enquiry! We will get back to you soon.');
        form.reset();
      })
      .catch(error => {
        errorEl.textContent = 'There was a problem submitting your enquiry. Please try again later.';
      });
    });
  </script>
</body>
</html>
