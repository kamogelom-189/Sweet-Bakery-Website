     <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff8f0;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header img {
      width: 100%;
      height: auto;
      display: block;
    }

    main {
      max-width: 1100px;
      margin: 20px auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #d2691e;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    li {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      padding: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    li:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    li img {
      border-radius: 12px;
      width: 100%;
      height: auto;
      margin-bottom: 10px;
    }

    li strong {
      font-size: 1.2rem;
      color: #333;
      display: block;
      margin-top: 10px;
    }

    .price {
      color: #d2691e;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <header>
    <img src="Sweet Delights Bakery.png" alt="Sweet Delights Bakery Logo">
  </header>

  <main>
    <h2>Our Products</h2>
    <section>
      <h2>Featured Products</h2>
      <ul>
        <li>
          <img src="download.jpeg" alt="Chocolate Cake">
          <strong>Chocolate Cake</strong>
          <p class="price">R700</p>
        </li>
        <li>
          <img src="download (1).jpeg" alt="Vanilla Cupcakes">
          <strong>Vanilla Cupcakes</strong>
          <p class="price">R150</p>
        </li>
        <li>
          <img src="images.jpeg" alt="Specialty Breads">
          <strong>Specialty Breads</strong>
          <p class="price">R200</p>
        </li>
      </ul>
    </section>
        </section>
        
    </main>

    </footer>
</body>
